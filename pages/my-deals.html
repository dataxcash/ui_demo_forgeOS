<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的单 · aiSpace</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav13" />
  <link rel="stylesheet" href="../css/shell.css?v=nav13" />
  <link rel="stylesheet" href="../css/pages.css?v=nav13" />
</head>
<body>
  <div id="page-root">
    <div class="page-head">
      <h1>我的单</h1>
      <p>只看待办。选中筛选项只高亮对应数字，不重复写一遍。</p>
    </div>
    <div id="rules"></div>
    <div class="toolbar">
      <div class="seg" id="filter">
        <button type="button" data-f="all" class="active">全部</button>
        <button type="button" data-f="urgent">须尽快</button>
        <button type="button" data-f="week">这周要动</button>
        <button type="button" data-f="watch">跟进中</button>
      </div>
      <span class="count-line" id="count"></span>
      <span style="flex:1"></span>
      <a class="btn" href="./done-deals.html">已完成（另册）</a>
    </div>
    <div id="board" class="deal-board"></div>
  </div>
  <script type="module">
    import { requireAccount, guardPage } from "../js/session.js?v=nav13";
    import { mountShell } from "../js/shell.js?v=nav13";
    import { getMyDeals } from "../js/api-mock.js?v=nav13";
    import { esc } from "../js/esc.js?v=nav13";
    import { rulesHtml } from "../js/deal-rules.js?v=nav13";

    const account = await requireAccount();
    if (!guardPage(account, ["employee", "manager"])) throw 0;
    await mountShell({ account, active: "my-deals" });
    document.getElementById("rules").innerHTML = rulesHtml();

    const BUCKET_OF = {
      urgent: "须尽快",
      week: "这周要动",
      watch: "跟进中",
    };

    let filter = new URLSearchParams(location.search).get("f") || "all";
    if (!BUCKET_OF[filter] && filter !== "all") filter = "all";

    const all = await getMyDeals(account, { scope: "mine", openOnly: true });
    const nUrgent = all.filter((d) => d.bucket === "须尽快").length;
    const nWeek = all.filter((d) => d.bucket === "这周要动").length;
    const nWatch = all.filter((d) => d.bucket === "跟进中").length;
    if (nUrgent + nWeek + nWatch !== all.length) {
      console.error("bucket sum mismatch", all.length, nUrgent, nWeek, nWatch);
    }

    function levelClass(bucket) {
      if (bucket === "须尽快") return "danger";
      if (bucket === "这周要动") return "warn";
      return "";
    }
    function mark(cond, text) {
      return cond ? `<span class="hl">${text}</span>` : text;
    }

    function paint() {
      document.querySelectorAll("#filter button").forEach((b) =>
        b.classList.toggle("active", b.dataset.f === filter)
      );
      let list = all;
      if (filter !== "all") list = all.filter((d) => d.bucket === BUCKET_OF[filter]);

      document.getElementById("count").innerHTML =
        `${mark(filter === "all", `未完成 ${all.length} 单`)}（` +
        `${mark(filter === "urgent", `须尽快 ${nUrgent}`)} · ` +
        `${mark(filter === "week", `这周要动 ${nWeek}`)} · ` +
        `${mark(filter === "watch", `跟进中 ${nWatch}`)}）`;

      const board = document.getElementById("board");
      if (!list.length) {
        board.innerHTML = `<div class="empty">当前筛选下没有单。</div>`;
        return;
      }
      board.innerHTML = list
        .map(
          (d) => `<a class="deal-row" href="./deal.html?id=${esc(d.id)}">
            <div class="deal-main">
              <div class="deal-title">${esc(d.name)}</div>
              <div class="deal-meta">
                <span class="pill">${esc(d.type)}</span>
                <span class="pill ${levelClass(d.bucket)}">${esc(d.status)}</span>
                <span class="muted">${esc(d.owner)}</span>
              </div>
              <div class="deal-why">${esc(d.why)}</div>
              <div class="deal-why muted" style="margin-top:2px">入桶：${esc(
                d.ruleHit || d.bucket
              )}</div>
            </div>
            <div class="deal-side">
              <span class="pill ${levelClass(d.bucket)}">${esc(d.bucket)}</span>
              <span class="deal-go">打开</span>
            </div>
          </a>`
        )
        .join("");
    }

    document.getElementById("filter").onclick = (e) => {
      const btn = e.target.closest("button[data-f]");
      if (!btn) return;
      filter = btn.dataset.f;
      const url = new URL(location.href);
      if (filter === "all") url.searchParams.delete("f");
      else url.searchParams.set("f", filter);
      history.replaceState(null, "", url);
      paint();
    };
    paint();
  </script>
</body>
</html>
