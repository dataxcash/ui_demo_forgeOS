<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>人事治理</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav13" />
  <link rel="stylesheet" href="../css/shell.css?v=nav13" />
  <link rel="stylesheet" href="../css/pages.css?v=nav13" />
</head>
<body>
  <div id="page-root">
    <div class="flash" id="flash"></div>
    <div class="page-head">
      <h1>人事治理</h1>
      <p>组织、开通与待确认。阶段一 ForgeOS WebUI 突出「导入确认板」。</p>
    </div>
    <div class="grid-2">
      <a class="card" href="./hr-import.html" style="display:block;color:inherit;text-decoration:none">
        <h2>导入确认</h2>
        <p class="muted small">CSV 批次须总确认后才开通账户</p>
      </a>
      <div class="card">
        <h2>组织与额度</h2>
        <p class="muted small">占位：部门树 / 额度包（本 ForgeOS WebUI 不深做）</p>
      </div>
    </div>
  </div>
  <script type="module">
    import { requireAccount, guardPage } from "../js/session.js?v=nav13";
    import { mountShell } from "../js/shell.js?v=nav13";
    const account = await requireAccount();
    if (!guardPage(account, ["hr"])) throw 0;
    await mountShell({ account, active: "hr-home" });
  </script>
</body>
</html>
