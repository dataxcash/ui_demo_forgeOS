<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>关系图谱</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav4" />
  <link rel="stylesheet" href="../css/shell.css?v=nav4" />
  <link rel="stylesheet" href="../css/pages.css?v=nav4" />
</head>
<body>
  <div id="page-root">
    <div class="flash" id="flash"></div>
    <div class="page-head">
      <h1>关系图谱</h1>
      <p>先看谱系与进程，再决定问或搜。经理可看「团队」切片。</p>
    </div>
    <div class="toolbar">
      <div class="seg" id="scope">
        <button type="button" data-scope="mine" class="active">我的</button>
        <button type="button" data-scope="team" id="scope-team" hidden>团队</button>
      </div>
      <a class="btn" href="./graph-candidates.html" id="link-cand" hidden>主题待确认</a>
    </div>
    <div id="board"></div>
  </div>
  <script type="module">
    import { requireAccount, guardPage } from "../js/session.js?v=nav4";
    import { mountShell } from "../js/shell.js?v=nav4";
    import { getThemes, getTeamBoard, getCandidates } from "../js/api-mock.js?v=nav4";
    import { esc } from "../js/esc.js?v=nav4";

    const account = await requireAccount();
    if (!guardPage(account, ["employee", "manager"])) throw 0;
    await mountShell({ account, active: "graph" });

    const isMgr = account.role === "manager";
    if (isMgr) {
      document.getElementById("scope-team").hidden = false;
      document.getElementById("link-cand").hidden = false;
      const n = (await getCandidates()).length;
      document.getElementById("link-cand").textContent = `主题待确认（${n}）`;
    }

    let scope = "mine";
    const themesAll = await getThemes();
    const team = await getTeamBoard();

    function paint() {
      let list;
      if (scope === "team" && isMgr) {
        list = team.themes;
        document.getElementById("board").innerHTML = `
          <div class="card" style="margin-bottom:14px">
            <div class="muted small">团队墙 · 按人（不含下属私域）</div>
            ${team.people
              .map(
                (p) =>
                  `<div style="margin-top:8px"><strong>${esc(p.name)}</strong>
                  <span class="muted small"> · ${p.themes.length} 题</span></div>`
              )
              .join("")}
          </div>
          <ul class="list">${list
            .map(
              (t) => `<li>
                <a class="title" href="./graph-theme.html?id=${esc(t.id)}">${esc(t.name)}</a>
                <div class="meta">${esc(t.type || "")} · ${esc(t.owner)} · ${esc(t.status)}</div>
              </li>`
            )
            .join("")}</ul>`;
      } else {
        list = themesAll.filter((t) =>
          isMgr ? true : ["李娜", "钱进"].includes(t.owner) || t.owner === account.name
        );
        // employee/manager "mine": show themes owned by 李娜 primarily for demo
        if (!isMgr || scope === "mine") {
          list = themesAll.filter((t) => t.owner === "李娜" || t.id === "T-041");
        }
        document.getElementById("board").innerHTML = `<ul class="list">${list
          .map(
            (t) => `<li>
              <a class="title" href="./graph-theme.html?id=${esc(t.id)}">${esc(t.name)}</a>
              <div class="meta"><span class="pill">${esc(t.type)}</span>${esc(t.status)} · 更新 ${esc(t.updated)}</div>
            </li>`
          )
          .join("")}</ul>`;
      }
    }

    document.getElementById("scope").onclick = (e) => {
      const btn = e.target.closest("button[data-scope]");
      if (!btn) return;
      scope = btn.dataset.scope;
      document.querySelectorAll("#scope button").forEach((b) =>
        b.classList.toggle("active", b === btn)
      );
      paint();
    };
    paint();
  </script>
</body>
</html>
