<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>同步目录 · 文档入库</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav7" />
  <link rel="stylesheet" href="../css/shell.css?v=nav7" />
  <link rel="stylesheet" href="../css/pages.css?v=nav7" />
</head>
<body>
  <div id="page-root">
    <div class="flash" id="flash"></div>
    <div class="page-head">
      <h1>同步目录</h1>
      <p>选择需要入库的目录。探针就绪后由专户读取；你只需勾选与查看结果。</p>
    </div>
    <div id="gate"></div>
    <div id="list"></div>
    <div class="toolbar" id="actions" hidden>
      <button type="button" class="btn btn-primary" id="save">保存目录配置</button>
      <a class="btn" href="./sync-status.html">看进料概况</a>
    </div>
  </div>
  <script type="module">
    import { requireAccount } from "../js/session.js?v=nav7";
    import { mountShell } from "../js/shell.js?v=nav7";
    import { getIngestState, ingestSaveDirs } from "../js/api-mock.js?v=nav7";
    import { confirmDialog } from "../js/confirm.js?v=nav7";
    import { esc } from "../js/esc.js?v=nav7";

    const account = await requireAccount();
    await mountShell({ account, active: "ingest-dirs" });

    const s = await getIngestState();
    if (s.phase !== "ready") {
      document.getElementById("gate").innerHTML = `
        <div class="rules-box">
          <div class="rules-title">探针未就绪</div>
          <p style="margin:0">请先完成 <a href="./ingest-setup.html">接入向导</a> 后再配置目录。</p>
        </div>`;
    } else {
      document.getElementById("actions").hidden = false;
      let dirs = s.dirs.map((d) => ({ ...d }));
      const list = document.getElementById("list");
      function paint() {
        list.innerHTML = dirs
          .map(
            (d, i) => `<div class="card" style="margin-bottom:8px">
              <label style="display:flex;gap:10px;align-items:flex-start">
                <input type="checkbox" data-i="${i}" ${d.enabled ? "checked" : ""} style="margin-top:3px"/>
                <span>
                  <div class="title">${esc(d.path)}</div>
                  <div class="meta">${esc(d.mode)} · ${d.files} 文件 · ${esc(d.bytes)}
                    · <span class="pill ${d.status === "正常" ? "ok" : ""}">${esc(d.status)}</span></div>
                </span>
              </label>
            </div>`
          )
          .join("");
        list.querySelectorAll("input[type=checkbox]").forEach((el) => {
          el.onchange = () => {
            dirs[+el.dataset.i].enabled = el.checked;
            dirs[+el.dataset.i].status = el.checked ? "正常" : "未启用";
          };
        });
      }
      paint();
      document.getElementById("save").onclick = async () => {
        const ok = await confirmDialog({
          title: "保存同步目录",
          body: "将按勾选目录由入库专户读取并进料。管理员口令不会再次索取。",
          confirmText: "保存",
        });
        if (!ok) return;
        await ingestSaveDirs(dirs);
        const flash = document.getElementById("flash");
        flash.textContent = "目录配置已保存（演示 · session）";
        flash.classList.add("show");
        paint();
      };
    }
  </script>
</body>
</html>
