<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>查阅材料 · ForgeOS</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav16" />
  <link rel="stylesheet" href="../css/shell.css?v=nav16" />
  <link rel="stylesheet" href="../css/pages.css?v=nav16" />
</head>
<body>
  <div id="page-root">
    <p class="muted small" id="back"></p>
    <div class="page-head" id="head"></div>
    <div class="card" id="body"></div>
  </div>
  <script type="module">
    import { requireAccount, guardPage } from "../js/session.js?v=nav16";
    import { mountShell } from "../js/shell.js?v=nav16";
    import { getDeal } from "../js/api-mock.js?v=nav16";
    import { esc } from "../js/esc.js?v=nav16";

    const account = await requireAccount();
    if (!guardPage(account, ["employee", "manager", "boss"])) throw 0;
    await mountShell({ account, active: "my-deals" });

    const q = new URLSearchParams(location.search);
    const dealId = q.get("deal") || "";
    const file = q.get("file") || "材料";
    const seg = q.get("seg") || "";
    const summary = q.get("summary") || "";
    const from = q.get("from") || "mine";

    document.getElementById("back").innerHTML = dealId
      ? `<a href="./aispace.html?view=deal&id=${esc(dealId)}&from=${esc(
          from
        )}">← 返回这一单</a>`
      : `<a href="./aispace.html?view=mine">← 我的单</a>`;

    document.title = `${file} · 查阅`;
    document.getElementById("head").innerHTML = `
      <h1>${esc(file)}</h1>
      <p>${seg ? `<span class="pill">${esc(seg)}</span>` : ""}${esc(summary || "材料预览（演示）")}</p>`;

    let extra = "";
    if (dealId) {
      const pack = await getDeal(dealId);
      if (pack) {
        const hit = pack.evidence.find((e) => e.file === file);
        if (hit) {
          extra = `<p class="small">所属跟单：<a href="./aispace.html?view=deal&id=${esc(
            dealId
          )}&from=${esc(from)}">${esc(pack.deal.name)}</a></p>
          <p class="small muted">摘录：${esc(hit.summary)}</p>`;
        }
      }
    }

    document.getElementById("body").innerHTML = `
      <div class="muted small" style="margin-bottom:8px">文件预览（演示稿 · 正式环境打开原文）</div>
      <pre style="margin:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;line-height:1.5">【${esc(
        file
      )}】
${seg ? "段落：" + esc(seg) + "\n" : ""}${esc(
      summary || "（无摘要）"
    )}

—— 以上为入库摘录；点击返回可继续就这一单提问。</pre>
      ${extra}`;
  </script>
</body>
</html>
