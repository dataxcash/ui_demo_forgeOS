<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>主题</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav13" />
  <link rel="stylesheet" href="../css/shell.css?v=nav13" />
  <link rel="stylesheet" href="../css/pages.css?v=nav13" />
</head>
<body>
  <div id="page-root">
    <p class="muted small"><a href="./graph.html">← 关系图谱</a></p>
    <div class="page-head" id="head"></div>
    <div class="tabs" id="tabs">
      <button type="button" data-tab="rel" class="active">关系</button>
      <button type="button" data-tab="time">进程</button>
      <button type="button" data-tab="mat">材料</button>
    </div>
    <div id="panel"></div>
  </div>
  <script type="module">
    import { requireAccount, guardPage } from "../js/session.js?v=nav13";
    import { mountShell } from "../js/shell.js?v=nav13";
    import { getTheme } from "../js/api-mock.js?v=nav13";
    import { esc } from "../js/esc.js?v=nav13";

    const account = await requireAccount();
    if (!guardPage(account, ["employee", "manager", "boss"])) throw 0;
    await mountShell({ account, active: "graph" });

    const id = new URLSearchParams(location.search).get("id") || "T-041";
    const data = await getTheme(id);
    if (!data.theme) {
      document.getElementById("panel").innerHTML = `<div class="empty">主题不存在</div>`;
      throw 0;
    }
    const t = data.theme;
    document.getElementById("head").innerHTML = `
      <h1>${esc(t.name)}</h1>
      <p><span class="pill">${esc(t.type)}</span>${esc(t.status)} · 负责人 ${esc(t.owner)}</p>`;

    let tab = "rel";
    function paint() {
      const p = document.getElementById("panel");
      if (tab === "rel") {
        p.innerHTML = data.relations.length
          ? data.relations
              .map(
                (r) => `<span class="rel-node">
                  <span class="k">${esc(r.kind)}</span>
                  ${
                    r.ref
                      ? `<a href="./graph-theme.html?id=${esc(r.ref)}">${esc(r.name)}</a>`
                      : esc(r.name)
                  }
                </span>`
              )
              .join("")
          : `<div class="empty">暂无关系边</div>`;
      } else if (tab === "time") {
        p.innerHTML = `<div class="timeline">${data.timeline
          .map(
            (e) => `<div class="ev">
              <div class="when">${esc(e.when)}</div>
              <div>${esc(e.text)}</div>
            </div>`
          )
          .join("")}</div>`;
      } else {
        p.innerHTML = data.evidence
          .map(
            (e) => `<div class="card">
              <div class="title">${esc(e.file)}</div>
              <div class="meta">${esc(e.seg)}</div>
              <p class="small" style="margin:8px 0 0">${esc(e.summary)}</p>
            </div>`
          )
          .join("") || `<div class="empty">暂无材料段</div>`;
      }
    }
    document.getElementById("tabs").onclick = (e) => {
      const b = e.target.closest("button[data-tab]");
      if (!b) return;
      tab = b.dataset.tab;
      document.querySelectorAll("#tabs button").forEach((x) =>
        x.classList.toggle("active", x === b)
      );
      paint();
    };
    paint();
  </script>
</body>
</html>
