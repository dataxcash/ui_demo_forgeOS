<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>进料概况 · 文档入库</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav7" />
  <link rel="stylesheet" href="../css/shell.css?v=nav7" />
  <link rel="stylesheet" href="../css/pages.css?v=nav7" />
</head>
<body>
  <div id="page-root">
    <div class="page-head">
      <h1>进料概况</h1>
      <p>本机进料量、容量与探针状态。未走完接入向导时，请先完成安装与授权。</p>
    </div>
    <div id="gate"></div>
    <div class="grid-2" id="stats" style="margin-bottom:12px"></div>
    <h2>探针</h2>
    <div id="probe" style="margin-top:8px"></div>
  </div>
  <script type="module">
    import { requireAccount } from "../js/session.js?v=nav7";
    import { mountShell } from "../js/shell.js?v=nav7";
    import { getIngestState } from "../js/api-mock.js?v=nav7";
    import { esc } from "../js/esc.js?v=nav7";

    const account = await requireAccount();
    await mountShell({ account, active: "sync-status" });

    const s = await getIngestState();
    if (s.phase !== "ready") {
      document.getElementById("gate").innerHTML = `
        <div class="rules-box">
          <div class="rules-title">尚未就绪（${esc(s.phase)}）</div>
          <p style="margin:0 0 8px">请先完成 <a href="./ingest-setup.html">接入向导</a>：SSHD → 管理员一次性授权 → slimSync。</p>
        </div>`;
    }

    const st = s.stats;
    document.getElementById("stats").innerHTML = `
      <div class="card"><div class="stat-label">今日上传</div><div class="stat" style="font-size:18px">${esc(st.todayUploaded)}</div></div>
      <div class="card"><div class="stat-label">今日下载</div><div class="stat" style="font-size:18px">${esc(st.todayDownloaded)}</div></div>
      <div class="card"><div class="stat-label">待处理</div><div class="stat" style="font-size:18px">${st.pending}</div></div>
      <div class="card"><div class="stat-label">异常</div><div class="stat" style="font-size:18px">${st.errors}</div>
        <p class="muted small" style="margin:6px 0 0">${esc(st.lastError || "")}</p></div>
      <div class="card"><div class="stat-label">已用容量</div><div class="stat" style="font-size:18px">${esc(st.capacityUsed)}</div>
        <p class="muted small" style="margin:6px 0 0">配额 ${esc(st.capacityQuota)}</p></div>
      <div class="card"><div class="stat-label">引导 SSHD</div><div class="stat" style="font-size:16px">${
        s.bootstrap.installed ? "已安装" : "未安装"
      }</div></div>`;

    document.getElementById("probe").innerHTML = `
      <div class="card">
        <div class="title">slimSync（Win）</div>
        <p class="small" style="margin:8px 0">状态 <span class="pill ${
          s.probe.slimSync === "在线" ? "ok" : "warn"
        }">${esc(s.probe.slimSync)}</span>
        ${s.probe.version ? ` · ${esc(s.probe.version)}` : ""}
        ${s.probe.lastHeartbeat ? ` · 心跳 ${esc(s.probe.lastHeartbeat)}` : ""}</p>
        <p class="muted small" style="margin:0">专户由系统管理，本页不展示口令。</p>
      </div>`;
  </script>
</body>
</html>
