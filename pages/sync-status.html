<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>入库管理 · 文档入库</title>
  <link rel="stylesheet" href="../css/tokens.css?v=nav8" />
  <link rel="stylesheet" href="../css/shell.css?v=nav8" />
  <link rel="stylesheet" href="../css/pages.css?v=nav8" />
</head>
<body>
  <div id="page-root">
    <div class="flash" id="flash"></div>
    <div class="page-head">
      <h1>入库管理</h1>
      <p>本机入库运行看板；目录加入后即监视，无需再保存。</p>
    </div>
    <div id="root"></div>
  </div>
  <div id="modal-root"></div>
  <script type="module">
    import { requireAccount } from "../js/session.js?v=nav8";
    import { mountShell } from "../js/shell.js?v=nav8";
    import {
      getIngestState,
      ingestAddDir,
      ingestRemoveDir,
    } from "../js/api-mock.js?v=nav8";
    import { confirmDialog } from "../js/confirm.js?v=nav8";
    import { esc } from "../js/esc.js?v=nav8";

    const account = await requireAccount();
    await mountShell({ account, active: "sync-status" });

    let s = await getIngestState();
    const root = document.getElementById("root");
    if (!root) throw new Error("缺少 #root");

    function tip(msg) {
      const flash = document.getElementById("flash");
      if (!flash) return;
      flash.textContent = msg;
      flash.classList.add("show");
    }

    function openAddDialog() {
      const wrap = document.getElementById("modal-root");
      wrap.innerHTML = `
        <div class="modal-backdrop show" id="dlg">
          <div class="modal" role="dialog" aria-label="添加目录">
            <h3 style="margin:0 0 8px;font-size:15px">添加入库目录</h3>
            <p class="muted small" style="margin:0 0 10px">确认后将通知同步组件加入监视列表。</p>
            <label class="muted small">目录路径</label>
            <input id="dir-path" style="width:100%;margin:4px 0 12px;padding:7px 8px;border:1px solid var(--line)" placeholder="例如 D:\\项目资料" />
            <div class="actions">
              <button type="button" class="btn" id="dlg-cancel">取消</button>
              <button type="button" class="btn btn-primary" id="dlg-ok">确认添加</button>
            </div>
          </div>
        </div>`;
      const close = () => {
        wrap.innerHTML = "";
      };
      document.getElementById("dlg-cancel").onclick = close;
      document.getElementById("dlg").onclick = (e) => {
        if (e.target.id === "dlg") close();
      };
      document.getElementById("dlg-ok").onclick = async () => {
        const path = document.getElementById("dir-path").value.trim();
        if (!path) {
          tip("请填写目录路径");
          return;
        }
        const res = await ingestAddDir(path);
        if (!res.ok) {
          tip(res.error || "添加失败");
          return;
        }
        close();
        tip("已加入监视");
        s = await getIngestState();
        paint();
      };
    }

    function paint() {
      if (s.phase !== "ready") {
        root.innerHTML = `
          <div class="dash">
            <div class="dash-health warn">
              <div class="dash-k">进料健康</div>
              <div class="dash-v">未接入</div>
            </div>
            <div class="dash-metrics">
              <div><span class="dash-k">今日进料</span><strong>—</strong></div>
              <div><span class="dash-k">容量</span><strong>—</strong></div>
              <div><span class="dash-k">待处理 / 失败</span><strong>— / —</strong></div>
            </div>
          </div>
          <p style="margin-top:14px"><a class="btn btn-primary" href="./ingest-setup.html">去接入向导</a></p>`;
        return;
      }

      const st = s.stats;
      const health =
        st.errors > 0 ? "warn" : s.probe.slimSync === "在线" ? "ok" : "warn";
      const healthText =
        st.errors > 0 ? "有异常" : s.probe.slimSync === "在线" ? "正常" : "延迟";
      const dirs = Array.isArray(s.dirs) ? s.dirs : [];

      root.innerHTML = `
        <div class="dash">
          <div class="dash-health ${health}">
            <div class="dash-k">进料健康</div>
            <div class="dash-v">${healthText}</div>
            <div class="muted small" style="margin-top:6px">探针 ${esc(
              s.probe.slimSync
            )} · ${esc(s.probe.version || "")} · 心跳 ${esc(
              s.probe.lastHeartbeat || "—"
            )}</div>
          </div>
          <div class="dash-metrics">
            <div><span class="dash-k">今日进料</span><strong>${esc(
              st.todayUploaded
            )}</strong><span class="muted small"> 上传</span></div>
            <div><span class="dash-k">容量</span><strong>${esc(
              st.capacityUsed
            )}</strong><span class="muted small"> / ${esc(
              st.capacityQuota
            )}</span></div>
            <div><span class="dash-k">待处理 / 失败</span><strong>${
              st.pending
            } / ${st.errors}</strong></div>
          </div>
          ${
            st.lastError
              ? `<div class="dash-alert">最近问题：${esc(st.lastError)}</div>`
              : ""
          }
        </div>

        <div class="deal-section" id="dirs">
          <div class="toolbar" style="margin-top:18px">
            <h2 style="margin:0;flex:1">入库目录</h2>
            <button type="button" class="btn btn-primary" id="btn-add">添加目录</button>
          </div>
          <div id="list"></div>
        </div>`;

      const list = document.getElementById("list");
      if (!dirs.length) {
        list.innerHTML = `<div class="empty">还没有监视目录，点击「添加目录」。</div>`;
      } else {
        list.innerHTML = dirs
          .map(
            (d) => `<div class="card dir-row" style="margin-bottom:8px">
              <div class="deal-main">
                <div class="deal-title">${esc(d.path)}</div>
                <div class="deal-meta">
                  <span class="pill ok">${esc(d.status || "监视中")}</span>
                  <span class="muted">${d.files ?? 0} 文件 · ${esc(
              d.bytes || "—"
            )}</span>
                </div>
              </div>
              <button type="button" class="btn" data-del="${esc(d.id)}">删除</button>
            </div>`
          )
          .join("");
      }

      document.getElementById("btn-add").onclick = openAddDialog;
      list.querySelectorAll("[data-del]").forEach((btn) => {
        btn.onclick = async () => {
          const id = btn.getAttribute("data-del");
          const row = dirs.find((d) => d.id === id);
          const ok = await confirmDialog({
            title: "删除目录",
            body: `将停止监视「${row ? row.path : id}」，并从监视列表移除。`,
            confirmText: "删除",
          });
          if (!ok) return;
          await ingestRemoveDir(id);
          tip("已从监视列表移除");
          s = await getIngestState();
          paint();
        };
      });
    }

    paint();
    if (location.hash === "#dirs") {
      document.getElementById("dirs")?.scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
